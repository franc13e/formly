<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="#FDF6EE"/>
  <!-- Thin guide ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#EAD9C8" stroke-width="1.5"/>
  <!-- Arc segments on ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#D4C8F0" stroke-width="4" stroke-dasharray="43 95" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#F5C8C8" stroke-width="4" stroke-dasharray="32 106" stroke-dashoffset="-46" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#B8DDB0" stroke-width="4" stroke-dasharray="25 113" stroke-dashoffset="-81" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#FFE89A" stroke-width="4" stroke-dasharray="34 104" stroke-dashoffset="-109" stroke-linecap="round"/>
  <!-- Today dot at top -->
  <circle cx="50" cy="6" r="4" fill="#5040A0"/>
  <!-- Petals -->
  <ellipse cx="50" cy="31" rx="7" ry="14" fill="#D4C8F0" opacity="0.95" transform="rotate(0 50 50)"/>
  <ellipse cx="50" cy="31" rx="7" ry="14" fill="#F5C8C8" opacity="0.95" transform="rotate(72 50 50)"/>
  <ellipse cx="50" cy="31" rx="7" ry="14" fill="#FFE89A" opacity="0.95" transform="rotate(144 50 50)"/>
  <ellipse cx="50" cy="31" rx="7" ry="14" fill="#B8DDB0" opacity="0.95" transform="rotate(216 50 50)"/>
  <ellipse cx="50" cy="31" rx="7" ry="14" fill="#FFCBA4" opacity="0.95" transform="rotate(288 50 50)"/>
  <!-- Centre -->
  <circle cx="50" cy="50" r="8" fill="#FDF6EE"/>
  <circle cx="50" cy="50" r="5" fill="#5040A0" opacity="0.8"/>
</svg>
